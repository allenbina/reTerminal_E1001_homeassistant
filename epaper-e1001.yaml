esphome:
  name: epaper-e1001
  friendly_name: epaper_e1001
  on_boot:
    priority: 600
    then:
      # Enable battery ADC circuit
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      # Wait until WiFi + HA API are both ready
      - wait_until:
          condition:
            and:
              - wifi.connected:
              - api.connected:
          timeout: 30s
      # Give HA a moment to push all sensor states
      - delay: 6s
      # Refresh the display
      - component.update: epaper_display
      # Wait for the e-paper refresh cycle to fully complete
      - delay: 4s
      # Enter deep sleep — wakes after 2h or instantly on green button press
      - deep_sleep.enter: deep_sleep_1

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

# Minimal logging in production — faster boot, less CPU time wasted
logger:
  level: WARN

api:

ota:
  - platform: esphome

wifi:
  ssid: "#########YOUR SSID#########"
  password: "######### YOUR PASSWORD #########"
  # HIGH power save mode — biggest single WiFi power saving tweak.
  # Saves ~20-30% WiFi draw at the cost of slightly slower initial connect.
  power_save_mode: HIGH
  # Skip full network scan if the last AP is still visible
  fast_connect: true

# Deep sleep: 2 hours between refreshes, or wake instantly with green button
deep_sleep:
  id: deep_sleep_1
  sleep_duration: 2h
  wakeup_pin:
    number: GPIO3       # Green button on top of device
    inverted: true
  wakeup_pin_mode: INVERT_WAKEUP

# reTerminal E1001 specific SPI pins
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# Battery enable pin — must be HIGH before ADC read
output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    # Read once per boot only — no need to poll during sleep cycles
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: 2.0
    internal: true
    on_value:
      then:
        - component.update: battery_level

  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    update_interval: never
    internal: true
    lambda: |-
      float v = id(battery_voltage).state;
      // LiPo: 3.3V = 0%, 4.2V = 100%
      float pct = (v - 3.3f) / (4.2f - 3.3f) * 100.0f;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      return pct;

font:
  - file: "gfonts://Roboto"
    id: font_regular
    size: 22

  - file: "gfonts://Roboto@700"
    id: font_bold
    size: 26

  - file: "gfonts://Roboto@700"
    id: font_bold_small
    size: 18

  - file: "gfonts://Roboto@700"
    id: font_time
    size: 36

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_weather_icons
    size: 30
    glyphs:
      - "\U000F0599"  # weather-sunny
      - "\U000F0F31"  # weather-night (clear-night)
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0590"  # weather-cloudy
      - "\U000F0597"  # weather-rainy
      - "\U000F0596"  # weather-pouring
      - "\U000F0598"  # weather-snowy
      - "\U000F0591"  # weather-fog
      - "\U000F059D"  # weather-windy
      - "\U000F0593"  # weather-lightning
      - "\U000F067E"  # weather-partly-rainy

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_battery_icon
    size: 28
    glyphs:
      - "\U000F007A"  # battery-100
      - "\U000F007B"  # battery-90
      - "\U000F007C"  # battery-80
      - "\U000F007D"  # battery-70
      - "\U000F007E"  # battery-60
      - "\U000F007F"  # battery-50
      - "\U000F0080"  # battery-40
      - "\U000F0081"  # battery-30
      - "\U000F0082"  # battery-20
      - "\U000F0083"  # battery-10
      - "\U000F008E"  # battery-outline (empty)
      - "\U000F0084"  # battery-charging

text_sensor:
  - platform: homeassistant
    name: "Calendar Data"
    entity_id: sensor.epaper_calendar_text
    attribute: content
    id: cal_data
    internal: true

  - platform: homeassistant
    name: "Todo Data"
    entity_id: sensor.epaper_todo_text
    attribute: content
    id: todo_data
    internal: true

  - platform: homeassistant
    name: "Weather Data"
    entity_id: sensor.epaper_weather_text
    attribute: content
    id: weather_data
    internal: true

time:
  - platform: homeassistant
    id: homeassistant_time

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    # Never auto-refresh — controlled entirely from on_boot sequence
    update_interval: never
    lambda: |-
      // Layout constants
      int left_margin = 15;
      int center_x = 405;
      int cal_start_x = left_margin;
      int current_y = 15;
      int content_bottom = 470;
      int line_height = 26;
      int right_margin = center_x + 15;
      int todo_start_x = right_margin;
      int todo_y = 15;
      int todo_bottom = 340;
      int todo_line_height = line_height;
      int weather_y = 355;

      // Draw vertical divider
      it.line(center_x, 0, center_x, 480);

      // ============================================
      // CALENDAR SECTION (LEFT)
      // ============================================

      if (id(cal_data).has_state()) {
        std::string content = id(cal_data).state;

        size_t start_pos = 0;
        size_t end_pos = 0;

        while ((end_pos = content.find('\n', start_pos)) != std::string::npos && current_y < content_bottom) {
          std::string line = content.substr(start_pos, end_pos - start_pos);
          start_pos = end_pos + 1;

          if (line.length() > 75) line = line.substr(0, 72) + "...";

          if (!line.empty()) {
            if (line.find(':') == std::string::npos && line.find('/') != std::string::npos) {
              it.print(cal_start_x, current_y, id(font_bold), line.c_str());
              current_y += 30;
            } else {
              int x_offset = cal_start_x + 10;

              const size_t WRAP_AT = 38;
              const size_t SECOND_LINE_MAX = 36;

              std::string l1 = line;
              std::string l2 = "";

              if (line.length() > WRAP_AT) {
                size_t dash_pos = line.find(" - ");
                if (dash_pos != std::string::npos && dash_pos > 0 && dash_pos < line.length() - 3) {
                  l1 = line.substr(0, dash_pos);
                  l2 = line.substr(dash_pos);
                } else {
                  size_t split = line.rfind(' ', WRAP_AT);
                  if (split == std::string::npos || split < 10) {
                    split = WRAP_AT;
                  }
                  l1 = line.substr(0, split);
                  l2 = line.substr(split);
                  while (!l2.empty() && l2.front() == ' ') l2.erase(0, 1);
                }
              }

              if (l2.length() > SECOND_LINE_MAX) {
                l2 = l2.substr(0, SECOND_LINE_MAX - 3) + "...";
              }

              it.print(x_offset, current_y, id(font_regular), l1.c_str());
              current_y += line_height;

              if (!l2.empty() && current_y < content_bottom) {
                it.print(x_offset + 12, current_y, id(font_regular), l2.c_str());
                current_y += line_height;
              }
            }
          }
        }
      } else {
        it.print(cal_start_x, 15, id(font_regular), "Loading calendar...");
      }

      // ============================================
      // TODO SECTION (RIGHT)
      // ============================================

      if (id(todo_data).has_state()) {
        std::string tcontent = id(todo_data).state;

        size_t tstart = 0;
        size_t tend = 0;

        while ((tend = tcontent.find('\n', tstart)) != std::string::npos && todo_y < todo_bottom) {
          std::string tline = tcontent.substr(tstart, tend - tstart);
          tstart = tend + 1;

          if (!tline.empty()) {
            if (tline.length() > 43) tline = tline.substr(0, 40) + "...";
            it.print(todo_start_x, todo_y, id(font_regular), tline.c_str());
            todo_y += todo_line_height;
          }
        }

        if (todo_y < todo_bottom && tstart < tcontent.size()) {
          std::string tline = tcontent.substr(tstart);
          if (!tline.empty()) {
            if (tline.length() > 43) tline = tline.substr(0, 40) + "...";
            it.print(todo_start_x, todo_y, id(font_regular), tline.c_str());
          }
        }

      } else {
        it.print(todo_start_x, 15, id(font_regular), "Loading todo...");
      }

      // ============================================
      // BOTTOM RIGHT: Weather (left) + Battery/Time (right) side by side
      // ============================================
      it.line(center_x, weather_y - 10, 800, weather_y - 10);

      int batt_col_x = 675;
      it.line(batt_col_x, weather_y - 10, batt_col_x, 480);

      auto weather_icon = [](const std::string &cond) -> std::string {
        if (cond == "sunny")               return "\U000F0599";
        if (cond == "clear-night")         return "\U000F0F31";
        if (cond == "partlycloudy")        return "\U000F0595";
        if (cond == "cloudy")              return "\U000F0590";
        if (cond == "rainy")               return "\U000F0597";
        if (cond == "pouring")             return "\U000F0596";
        if (cond == "snowy")               return "\U000F0598";
        if (cond == "fog")                 return "\U000F0591";
        if (cond == "windy")               return "\U000F059D";
        if (cond == "lightning")           return "\U000F0593";
        if (cond == "lightning-rainy")     return "\U000F0593";
        if (cond == "partlycloudy-rainy")  return "\U000F067E";
        return "\U000F0590";
      };

      if (id(weather_data).has_state()) {
        std::string wcontent = id(weather_data).state;

        struct WDay {
          std::string condition;
          float high;
          float low;
        };
        WDay days[3];
        int day_count = 0;

        size_t wstart = 0;
        size_t wend = 0;
        while (day_count < 3) {
          wend = wcontent.find('\n', wstart);
          std::string wline = (wend == std::string::npos)
            ? wcontent.substr(wstart)
            : wcontent.substr(wstart, wend - wstart);

          size_t p1 = wline.find('|');
          size_t p2 = wline.find('|', p1 + 1);
          if (p1 != std::string::npos && p2 != std::string::npos) {
            days[day_count].condition = wline.substr(0, p1);
            days[day_count].high = atof(wline.substr(p1 + 1, p2 - p1 - 1).c_str());
            days[day_count].low  = atof(wline.substr(p2 + 1).c_str());
            day_count++;
          }

          if (wend == std::string::npos) break;
          wstart = wend + 1;
        }

        auto now = id(homeassistant_time).now();
        const char* day_names[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};

        int weather_area_w = batt_col_x - center_x - 15;
        int col_width = weather_area_w / 3;
        int col_start = center_x + 10;

        for (int i = 0; i < day_count; i++) {
          int x = col_start + (i * col_width);
          int future_dow = (now.day_of_week - 1 + i) % 7;
          const char* day = (i == 0) ? "Today" : day_names[future_dow];

          it.print(x,  weather_y,      id(font_bold_small),    day);
          it.print(x,  weather_y + 20, id(font_weather_icons), weather_icon(days[i].condition).c_str());
          it.printf(x, weather_y + 55, id(font_bold_small),    "%.0f/%.0f", days[i].high, days[i].low);
        }
      } else {
        it.print(todo_start_x, weather_y, id(font_regular), "Loading...");
      }

      // ============================================
      // BATTERY + TIME (right sub-column)
      // ============================================
      int batt_x = batt_col_x + 8;
      int batt_y = weather_y + 4;

      if (id(battery_level).has_state()) {
        float pct = id(battery_level).state;
        std::string batt_icon;
        if      (pct >= 95) batt_icon = "\U000F007A";
        else if (pct >= 85) batt_icon = "\U000F007B";
        else if (pct >= 75) batt_icon = "\U000F007C";
        else if (pct >= 65) batt_icon = "\U000F007D";
        else if (pct >= 55) batt_icon = "\U000F007E";
        else if (pct >= 45) batt_icon = "\U000F007F";
        else if (pct >= 35) batt_icon = "\U000F0080";
        else if (pct >= 25) batt_icon = "\U000F0081";
        else if (pct >= 15) batt_icon = "\U000F0082";
        else if (pct >= 5)  batt_icon = "\U000F0083";
        else                batt_icon = "\U000F008E";

        it.print( batt_x,      batt_y,      id(font_battery_icon), batt_icon.c_str());
        it.printf(batt_x + 32, batt_y + 5,  id(font_bold_small),   "%.0f%%", pct);
      }

      // Time: hour:min on one line, AM/PM below
      auto tnow = id(homeassistant_time).now();
      if (tnow.is_valid()) {
        int hour = tnow.hour;
        const char* ampm = (hour >= 12) ? "PM" : "AM";
        if (hour > 12) hour -= 12;
        if (hour == 0) hour = 12;
        it.printf(batt_x, batt_y + 38, id(font_bold),       "%d:%02d", hour, tnow.minute);
        it.print( batt_x, batt_y + 68, id(font_bold_small), ampm);
      }
